<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신청 완료 | 더샵 송도그란테르</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --navy:#1f3a34;
  --point:#2f6b5e;
  --point-light:#3c8073;
  --accent:#c8a24a;
  --ink:#243b35;
  --muted:#7c8a85;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  background:#f7f9f8;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  position:relative;overflow:hidden;
}
/* 은은한 배경 장식 */
body::before,body::after{
  content:"";position:absolute;border-radius:50%;z-index:0;
}
body::before{width:420px;height:420px;top:-140px;right:-120px;
  background:radial-gradient(circle,rgba(47,107,94,.10),transparent 70%);}
body::after{width:360px;height:360px;bottom:-120px;left:-120px;
  background:radial-gradient(circle,rgba(200,162,74,.12),transparent 70%);}

.card{
  position:relative;z-index:1;max-width:480px;width:100%;text-align:center;
  background:#fff;border:1px solid #eef2f0;border-radius:24px;
  padding:52px 34px 40px;
  box-shadow:0 30px 70px rgba(31,58,52,.10);
  animation:cardIn .8s cubic-bezier(.16,1,.3,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

.brand{
  font-size:12px;letter-spacing:3px;font-weight:700;color:var(--point);
  margin-bottom:26px;opacity:0;animation:fadeUp .7s ease forwards .5s;
}

/* 체크 서클 (그려지는 애니메이션) */
.check-wrap{width:92px;height:92px;margin:0 auto 26px}
.check-svg{width:100%;height:100%;display:block}
.check-circle{
  fill:none;stroke:var(--point);stroke-width:4;
  stroke-dasharray:283;stroke-dashoffset:283;
  animation:drawCircle .9s ease forwards .3s;
}
.check-mark{
  fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:60;stroke-dashoffset:60;
  animation:drawMark .5s cubic-bezier(.65,0,.45,1) forwards 1s;
}
@keyframes drawCircle{to{stroke-dashoffset:0}}
@keyframes drawMark{to{stroke-dashoffset:0}}

h1{
  font-family:'Noto Serif KR',serif;font-size:26px;font-weight:700;color:var(--navy);
  margin-bottom:14px;line-height:1.4;
  opacity:0;animation:fadeUp .7s ease forwards .9s;
}
.desc{
  color:var(--muted);font-size:15px;line-height:1.9;
  opacity:0;animation:fadeUp .7s ease forwards 1.05s;
}
.divider{
  width:44px;height:2px;background:var(--accent);margin:24px auto;
  opacity:0;animation:fadeUp .7s ease forwards 1.15s;
}
.tel{
  font-size:14px;color:var(--muted);
  opacity:0;animation:fadeUp .7s ease forwards 1.2s;
}
.tel b{display:block;color:var(--point);font-size:26px;font-weight:900;margin-top:4px;letter-spacing:1px}

.btn{
  display:inline-block;margin-top:30px;padding:15px 40px;border-radius:10px;
  background:linear-gradient(135deg,var(--point),var(--point-light));color:#fff;
  font-weight:700;font-size:15px;text-decoration:none;
  box-shadow:0 10px 24px rgba(47,107,94,.28);
  transition:transform .12s ease,box-shadow .2s ease;
  opacity:0;animation:fadeUp .7s ease forwards 1.35s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(47,107,94,.36)}
.btn:active{transform:scale(.97)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KVK3G39K"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="card">
  <div class="brand">THE SHARP 송도그란테르 · SONGDO</div>

  <div class="check-wrap">
    <svg class="check-svg" viewBox="0 0 100 100">
      <circle class="check-circle" cx="50" cy="50" r="45"/>
      <path class="check-mark" d="M30 51 L44 65 L71 36"/>
    </svg>
  </div>

  <h1>관심고객 등록이<br>완료되었습니다</h1>
  <p class="desc">소중한 신청 감사합니다.<br>담당자가 순차적으로 연락드리겠습니다.</p>

  <div class="divider"></div>

  <p class="tel">대표문의 <b>1866-2766</b></p>

  <a class="btn" href="index.html">메인으로 돌아가기</a>
</div>
</body>
</html>
